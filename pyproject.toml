[project]
name = "Repolens"
version = "0.2.0"
description = "An efficient retrieval engine focused on codebases"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-genai>=2.12.1",
    "magika>=1.0.3",
    "python-dotenv>=1.2.2",
    "tree-sitter-language-pack>=1.12.5",
    "pydantic>=2.0",
    "httpx>=0.27",

    "rank-bm25>=0.2.2",
    "qdrant-client>=1.18.0",
    "sentence-transformers>=5.6.1",
    "tqdm>=4.66",
    "torch",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = []
